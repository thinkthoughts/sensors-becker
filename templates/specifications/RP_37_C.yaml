engineering_object: Microcalorimeter
engineering_direction: Toward next-generation microcalorimeters.
source:
  title: Achieving 1% Assay of Special Nuclear Materials in 2 Minutes with Microcalorimeter-Array Gamma-Ray
    Spectroscopy
  author: Dan Becker
  event: ARPA-E Fission Annual Meeting
  date: 2025-10-01/2025-10-02
  source_file: Daniel Becker (1).pdf
source_engineering_states:
  measured_progress:
  - 'Per-detector count rate: 140 counts per second.'
  - 'Pulse fall time to 1% of peak: approximately 1.5 milliseconds.'
  - 'Athermal tails: negligible.'
  - 'Energy resolution: approximately 150 electronvolts at 100 kiloelectronvolts.'
  - 'Detector speed improvement: approximately 14 times the pre-CURIE result.'
  leading_specifications:
  - Increase per-detector count rate toward 200 counts per second.
  - Restore energy resolution to less than 100 electronvolts at 100 kiloelectronvolts.
  - Preserve negligible athermal tails.
  - Lower operating temperature and superconducting critical temperature.
  - Continue refinement of the all-silicon, membrane-free detector architecture.
  engineering_priorities:
  - Lower superconducting critical temperature.
  - Increase coupling to silicon.
  - Solve absorber manufacturing constraints.
  - Validate performance with relevant Idaho National Laboratory samples.
  - Define requirements for product assembly.
footer: Admissible generalizations trail leading specifications.
