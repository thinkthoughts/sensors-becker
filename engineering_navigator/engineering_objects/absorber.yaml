current_evidence:
- statement: Electroplated bismuth preserves a Gaussian-like spectral response under matched thermal coupling, while
    evaporated bismuth exhibits low-energy tailing.
  sources:
  - SOURCE_02
- statement: Evaporated bismuth has substantially smaller grains than electroplated bismuth in the reviewed source
    set.
  sources:
  - SOURCE_01
  - SOURCE_02
- statement: Three-micrometer bismuth layers add useful x-ray stopping power with little reported heat-capacity
    penalty relative to the gold base in SOURCE_02.
  sources:
  - SOURCE_02
candidate_specifications:
- Track grain size and morphology as manufacturing acceptance variables.
- Treat absorber thickness as a coupled stopping-power and thermalization variable.
- Use low-energy spectral tailing as a validation measurement for absorber thermalization.
