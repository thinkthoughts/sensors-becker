schema_version: 1.0.0
repository: sensors-becker
id: multiplexed_readout
title: Multiplexed Readout
engineering_driver: multiplexed_readout
object_type: readout_architecture
object_status: evidence_bounded
objective: Scale TES readout by assigning many resonator-coupled channels to shared RF bandwidth while preserving
  trackability, low readout noise, and explicit collision/band-edge constraints.
evidence_sources:
- SOURCE_05
- SOURCE_06
