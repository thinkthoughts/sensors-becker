candidate_specifications: []
open_specifications:
- concept: gdt_readout_mapping
  open_specification: A direct General Divisor Theorem mapping requires a physically justified integer state, natural
    modulus, residue-class rule, and coprimality/factor-exclusion rule.
  gap_sources:
  - SOURCE_05
  source_count: 1
  next_measurement: Identify whether channel/sub-band allocation, collision avoidance, synchronization, or firmware
    compatibility supplies a real modular plus factor-exclusion rule.
relationships:
- to: tes
  type: supports
- to: detector_module
  type: supports
- to: instrument_scaling
  type: supports
current_evidence:
- statement: unique_resonator_frequency_enables_channelization
  engineering_effect: Each TES/rf-SQUID channel is associated with its own microwave resonator frequency for frequency-domain
    multiplexing.
  source: SOURCE_05
  source_pages:
  - 1
  - 2
- statement: resonator_spacing_constrains_trackable_channel_density
  engineering_effect: Channels too close in frequency can collide and become untrackable.
  source: SOURCE_05
  source_pages:
  - 7
  - 8
  - 10
- statement: band_edges_constrain_resonator_placement
  engineering_effect: Resonators too near 500 MHz band edges cannot be tracked reliably by SMuRF.
  source: SOURCE_05
  source_pages:
  - 7
- statement: subband_partition_sets_digital_tone_capacity
  engineering_effect: 128 analysis sub-bands with up to four tones each provide 512 tones per 614.4 MHz band in
    the reported firmware.
  source: SOURCE_05
  source_pages:
  - 6
- statement: flux_ramp_parameters_set_carrier_frequency
  engineering_effect: Carrier frequency scales as flux-ramp reset rate times swept flux quanta per period.
  source: SOURCE_05
  source_pages:
  - 6
- statement: resonator_grouping_reduces_collision_risk
  engineering_effect: Four resonator sub-bands per 66-channel chip were intentionally used to guard against intra-chip
    frequency collisions.
  source: SOURCE_05
  source_pages:
  - 8
- statement: tone_tracking_reduces_linearity_burden
  engineering_effect: Closed-loop tracking keeps tones near resonance and reduces summed RF power variation relative
    to fixed-tone readout.
  source: SOURCE_05
  source_pages:
  - 1
  - 3
- statement: resonator_frequency_maps_to_subband_and_channel
  engineering_effect: assign_channels maps resonator frequencies to integer subband and channel arrays.
  source: SOURCE_06
  source_sections:
  - assign_channels
- statement: minimum_frequency_offset_excludes_close_pairs
  engineering_effect: If two resonators are closer than the configured minimum offset, both are ignored.
  source: SOURCE_06
  source_sections:
  - assign_channels
- statement: channel_capacity_is_bounded_per_subband
  engineering_effect: The default assignment capacity is four channels per subband.
  source: SOURCE_06
  source_sections:
  - assign_channels
- statement: tracking_quality_disables_bad_channels
  engineering_effect: check_lock turns off channels that violate tracking quality limits.
  source: SOURCE_06
  source_sections:
  - check_lock
gdt_applicability:
  status: discrete_structure_present_but_direct_GDT_not_established
  candidate_integer_structures:
  - filterbank_subband_index
  - tones_per_subband
  - harmonic_order
  - resonator_grouping
  missing_direct_hypotheses:
  - physically justified integer state n
  - natural modulus m
  - physical residue-class rule n ≡ a (mod m)
  - physical factor-exclusion rule gcd(n,N)=1
