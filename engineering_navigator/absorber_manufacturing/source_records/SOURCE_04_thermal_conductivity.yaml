fabrication_methods:
- method: sputter_deposition
  details: 100 nm Au deposited over a 5 nm Ti adhesion layer
- method: photolithography_and_liftoff
  details: Au measurement leads patterned using Heidelberg MLA150 lithography and liftoff
- method: thick_photoresist_mold
  details: ~23 um AZ P4620 mold formed with a two-layer spin process, cooler/longer soft bakes, and multiple exposures
- method: surface_preparation
  details: 1 min O2 plasma RIE descum followed by 10 s dilute nitric-acid dip
- method: bismuth_electroplating
  details: low-throw room-temperature plating in an unagitated acidic Bi electrolyte
- method: four_wire_resistance_measurement
  details: Bi bridge geometry isolates the Bi electrical resistance from the underlying Au seed layer
