measured_outcomes:
- outcome: Bi_resistance_vs_temperature
  result: Resistivity falls from 300 K to about 230 K, then rises to about 10 K and saturates at lower temperature.
- outcome: room_temperature_resistance_scaling
  result: Measured 300 K resistance closely matches values expected from bulk Bi resistivity for the three test
    geometries.
- outcome: thermal_conductivity_at_3K
  result: Estimated kappa values span 3.44e-2 to 4.62e-2 W m^-1 K^-1 across the three reported geometries.
- outcome: absorber_thermalization
  result: Electroplated Bi thermal conductivity is judged sufficient for X-ray heat to thermalize in the TES before
    escape through the SiN membrane.
equations:
- id: wiedemann_franz
  expression: kappa = sigma * L * T
  variables:
    kappa: thermal conductivity
    sigma: electrical conductivity
    L: Lorenz number
    T: temperature
  use: Estimate low-temperature Bi thermal conductivity from electrical conductivity.
assumptions:
- assumption: bulk_Bi_Lorenz_number_estimate
  description: The Lorenz number is estimated using literature bulk-Bi thermal conductivity and resistivity at 300
    K.
- assumption: Wiedemann_Franz_applicability
  description: Low-temperature thermal conductivity is estimated from measured electrical conductivity using the
    Wiedemann-Franz relation.
- assumption: four_wire_geometry_isolates_Bi
  description: Electrical continuity between the Au leads occurs through the electroplated Bi bridge, allowing the
    measured voltage drop to represent Bi resistance.
