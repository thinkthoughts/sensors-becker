engineering_constraints:
- constraint: electrolyte_pH
  statement: pH must remain below about 0.3 to prevent Bi precipitates, while plating is inhibited as pH approaches
    0.
- constraint: test_structure_length
  statement: 100 um between voltage leads was the maximum length achieved reliably for this bridge geometry.
- constraint: seed_layer_measurement_convolution
  statement: A conventional Bi/Au stack cannot directly reveal Bi resistivity because the more conductive Au layer
    dominates the electrical measurement.
- constraint: absorber_thermal_path
  statement: For acceptable TES operation, absorber heat must thermalize before escaping through the SiN membrane
    to the bath.
future_questions:
- Does the Bi microwire undergo a semimetal-to-semiconductor transition below about 250 K?
- How much does differential thermal contraction contribute to mechanical stress and the observed resistivity curve?
- How do electroplating conditions alter low-temperature Bi resistivity and thermal conductivity?
- How repeatable are these thermal-conductivity values across wafers, absorber geometries, and production batches?
unreported_variables:
- validated production tolerance for electroplating current density
- validated production tolerance for bath pH
- wafer-to-wafer distribution of low-temperature thermal conductivity
- batch-to-batch distribution of low-temperature thermal conductivity
- direct thermal-conductivity measurement at TES operating temperature
- manufacturing yield for the reported electroplating process
extraction_notes:
- The paper measures electrical resistance directly; low-temperature thermal conductivity is estimated using the
  Wiedemann-Franz relation rather than measured calorimetrically.
- The reported ~30 um Bi thickness belongs to the resistivity test microwires and should not be interpreted as a
  general TES absorber specification.
- The 7.7 mA/cm2 process point is a reported fabrication condition, not a validated manufacturing tolerance.
- The conclusion that thermalization is adequate is based on the relative thermal conductivities of Au, Bi, and
  the SiN membrane.
- Candidate mechanical-stress explanations are retained as hypotheses rather than promoted to established engineering
  relationships.
