id: absorber_manufacturing

title: Absorber Manufacturing

status: active

repository: sensors-becker

engineering_object: TES Microcalorimeter

objective: >
  Develop a repeatable absorber manufacturing process suitable
  for scalable TES microcalorimeter production.

why_it_matters: >
  Absorber manufacturing directly influences detector performance,
  manufacturing repeatability, detector-module assembly, and
  instrument-scale deployment.

current_status: >
  RP_43 establishes the current engineering specification for
  absorber manufacturing based on the reviewed Becker sources.

current_emphasis:
  - Repeatable absorber process
  - All-silicon architecture
  - Increased silicon coupling
  - Product assembly requirements
  - Instrument-scale deployment

