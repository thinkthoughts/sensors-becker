extraction_notes:
- SOURCE_05 opens the multiplexed-readout branch rather than extending absorber manufacturing.
- The paper explicitly uses a channel index synchronized to the FFT frame.
- The paper explicitly describes a linear flux ramp containing an integer number of flux quanta nPhi, with modulation
  frequency equal to flux-ramp rate times nPhi.
- These discrete structures are GDT candidates only; no coprimality constraint is assumed at scaffold stage.
