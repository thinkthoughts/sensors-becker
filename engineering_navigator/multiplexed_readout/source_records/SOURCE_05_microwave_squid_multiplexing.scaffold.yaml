gdt_applicability_priorities:
- candidate_structure: channel_index
  extract:
  - definition of channel index
  - index range
  - counter or frame synchronization rule
  - any periodic channel assignment rule
  - any excluded index classes
- candidate_structure: fft_bin_to_channel_mapping
  extract:
  - number of FFT bins
  - bin-selection rule
  - channel-to-bin assignment
  - periodicity of bin allocation
  - forbidden or collision-prone assignments
- candidate_structure: flux_ramp_integer_quanta
  extract:
  - integer number nPhi of flux quanta per ramp
  - relation between nPhi and modulation frequency
  - allowed values of nPhi
  - any factor, divisibility, aliasing, or compatibility constraints on nPhi
- candidate_structure: frequency_slot_allocation
  extract:
  - tone or resonator placement rule
  - bandwidth and spacing constraints
  - integer slot or bin representation if explicitly used
  - collision or crosstalk exclusion rules
- candidate_structure: direct_GDT_hypotheses
  extract:
  - physically natural integer state n
  - natural modulus m
  - residue condition n ≡ a mod m
  - factor-exclusion or coprimality rule gcd(n,N)=1
  instruction: Do not infer a GDT mapping from indexing alone; require explicit physical or firmware justification.
