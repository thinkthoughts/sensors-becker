assumptions:
- assumption: Channel assignment is driven by resonator frequency positions and documented software rules rather
    than by a published modular formula.
  source_section: assign_channels
engineering_relationships:
- relationship: resonator_frequency_maps_to_subband_and_channel
  engineering_effect: assign_channels maps resonator frequencies to integer subband and channel arrays.
  source_sections:
  - assign_channels
- relationship: minimum_frequency_offset_excludes_close_pairs
  engineering_effect: If two resonators are closer than the configured minimum offset, both are ignored.
  source_sections:
  - assign_channels
- relationship: channel_capacity_is_bounded_per_subband
  engineering_effect: The default assignment capacity is four channels per subband.
  source_sections:
  - assign_channels
- relationship: tracking_quality_disables_bad_channels
  engineering_effect: check_lock turns off channels that violate tracking quality limits.
  source_sections:
  - check_lock
- relationship: flux_quanta_target_is_not_intrinsically_integer
