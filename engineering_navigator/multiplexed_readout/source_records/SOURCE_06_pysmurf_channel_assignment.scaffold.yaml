extraction_notes:
- SOURCE_06 is software/firmware-facing evidence rather than a journal article.
- The key target is assign_channels(...), which maps resonator frequencies to integer subband and channel arrays.
- The documentation explicitly states a minimum resonator offset rule and that closer pairs are ignored.
- The documentation also confirms n_phi0 is float-valued; integer values are recommended but not required.
